<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abriendo WhatsApp... | Empanadazas®</title>
    
    <meta name="theme-color" content="#0E0F0D">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            background-color: #0E0F0D;
            color: #FEFAE4;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .redirect-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            text-align: center;
            padding: 24px;
        }
        .spinner {
            width: 38px;
            height: 38px;
            border: 3px solid rgba(247, 194, 104, 0.2);
            border-top-color: #F7C268;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .redirect-text {
            font-size: 0.95rem;
            color: #D3CEB8;
            font-weight: 600;
        }
        .btn-manual-wsp {
            display: none;
            margin-top: 8px;
            background: linear-gradient(135deg, #22C55E 0%, #16A34A 100%);
            color: #032311;
            font-size: 0.88rem;
            font-weight: 800;
            padding: 12px 22px;
            border-radius: 12px;
            text-decoration: none;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(34, 197, 94, 0.4);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <!-- MOTOR DE SALTO DIRECTO A LA APP NATIVA -->
    <script>
        (function() {
            // CARITA OFICIAL: 😋 (%F0%9F%98%8B)
            var branchData = {
                'palermo': {
                    phone: '5491151435364',
                    text: '%C2%A1Hola%20Empanadazas!%20%F0%9F%98%8B%20Quiero%20hacer%20un%20pedido%20para%20Palermo%20Soho'
                },
                'lomitas': {
                    phone: '5491150510287',
                    text: '%C2%A1Hola%20Empanadazas!%20%F0%9F%98%8B%20Quiero%20hacer%20un%20pedido%20para%20Las%20Lomitas'
                },
                'caballito': {
                    phone: '5491125428760',
                    text: '%C2%A1Hola%20Empanadazas!%20%F0%9F%98%8B%20Quiero%20hacer%20un%20pedido%20para%20Caballito'
                },
                'ramos': {
                    phone: '5491130091870',
                    text: '%C2%A1Hola%20Empanadazas!%20%F0%9F%98%8B%20Quiero%20hacer%20un%20pedido%20para%20Ramos%20Mej%C3%ADa'
                }
            };

            var params = new URLSearchParams(window.location.search);
            var branchKey = params.get('branch');
            var data = branchData[branchKey];

            if (data) {
                // 1. Enlace nativo directo al celular (salta la web y abre la app)
                var nativeAppUrl = "whatsapp://send?phone=" + data.phone + "&text=" + data.text;
                // 2. Enlace de respaldo web por si falla el protocolo nativo
                var webFallbackUrl = "https://wa.me/" + data.phone + "?text=" + data.text;

                // Disparo prioritario a la app de WhatsApp
                window.location.href = nativeAppUrl;

                // Si en 1.5 segundos no abrió la app, recurre a la web
                setTimeout(function() {
                    window.location.href = webFallbackUrl;
                }, 1500);

                // Botón manual de respaldo
                window.addEventListener('DOMContentLoaded', function() {
                    var btn = document.getElementById('manualBtn');
                    if (btn) {
                        btn.href = nativeAppUrl;
                        btn.style.display = 'inline-block';
                    }
                });
            } else {
                // Si no hay parámetro, regresa al menú de la app
                window.location.replace('/empanadazaswidget/app.html');
            }
        })();
    </script>
</head>
<body>
    <div class="redirect-box">
        <div class="spinner"></div>
        <p class="redirect-text">Abriendo WhatsApp...</p>
        <a id="manualBtn" href="#" class="btn-manual-wsp">Abrir WhatsApp</a>
    </div>
</body>
</html>
