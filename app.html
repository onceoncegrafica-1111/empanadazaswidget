    <style>
        /* FUENTE NEÓN MEXCELLENT */
        @font-face {
            font-family: 'Mexcellent';
            src: local('Mexcellent'),
                 local('Mexcellent-Regular'),
                 url('https://db.onlinewebfonts.com/t/3d65b7cb85949d2ddbaea671040f9ec3.woff2') format('woff2'),
                 url('https://db.onlinewebfonts.com/t/3d65b7cb85949d2ddbaea671040f9ec3.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-base: #0E0F0D;
            --bg-card: rgba(22, 23, 20, 0.90);
            --bg-card-hover: rgba(30, 31, 27, 0.98);
            
            --bronze-light: #FCEBD0;
            --bronze-bright: #F7C268;
            --bronze-mid: #E5A952;
            --brand-cream: #FEFAE4;
            --brand-cream-muted: #D3CEB8;
            
            --neon-bronze-glow: rgba(229, 169, 82, 0.55);
            --neon-bronze-subtle: rgba(247, 194, 104, 0.12);
            --border-card: rgba(229, 169, 82, 0.32);
            --border-card-hover: rgba(247, 194, 104, 0.95);
            
            --text-light: #FEFAE4;
            --text-muted: #8E9086;
            --text-subtle: #6E7068;
            
            --shadow-card: 0 10px 28px -4px rgba(0, 0, 0, 0.7), 0 2px 8px rgba(0, 0, 0, 0.4);
            --shadow-hero: 0 12px 36px -2px rgba(215, 139, 40, 0.4), 0 0 18px rgba(247, 194, 104, 0.3);
            --spring-curve: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--brand-cream);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 14px 45px;
            overflow-x: hidden;
            position: relative;
        }

        /* FONDO PAPEL DE REGALO CONTINUO */
        .hub-bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            background: radial-gradient(circle at 50% 15%, #20221E 0%, #151614 60%, #0E0F0D 100%);
            overflow: hidden;
            pointer-events: none;
        }

        .hub-ambient-spotlight {
            position: absolute;
            top: -120px;
            left: 50%;
            transform: translateX(-50%);
            width: 850px;
            height: 750px;
            background: radial-gradient(ellipse at 50% 30%, rgba(247, 194, 104, 0.22) 0%, rgba(215, 139, 40, 0.10) 45%, transparent 75%);
            filter: blur(80px);
            z-index: 1;
        }
